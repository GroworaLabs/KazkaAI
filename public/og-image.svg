<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D0A28"/>
      <stop offset="100%" stop-color="#1E1660"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4338CA" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4338CA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonHalo" cx="985" cy="130" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <filter id="titleGlow" x="-15%" y="-80%" width="130%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="domainGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <mask id="moonMask">
      <circle cx="985" cy="130" r="72" fill="white"/>
      <circle cx="1022" cy="110" r="62" fill="black"/>
    </mask>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="315" rx="540" ry="360" fill="url(#centerGlow)"/>

  <!-- Stars — tiny dots -->
  <circle cx="72" cy="52" r="1.5" fill="white" opacity="0.65"/>
  <circle cx="165" cy="33" r="1" fill="white" opacity="0.5"/>
  <circle cx="285" cy="72" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="435" cy="45" r="1" fill="white" opacity="0.45"/>
  <circle cx="520" cy="28" r="1.5" fill="white" opacity="0.55"/>
  <circle cx="680" cy="38" r="1" fill="white" opacity="0.5"/>
  <circle cx="755" cy="58" r="1.5" fill="white" opacity="0.65"/>
  <circle cx="1092" cy="42" r="1.5" fill="white" opacity="0.55"/>
  <circle cx="1155" cy="82" r="1" fill="white" opacity="0.45"/>
  <circle cx="50" cy="190" r="1" fill="white" opacity="0.4"/>
  <circle cx="125" cy="310" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="1065" cy="195" r="1" fill="white" opacity="0.5"/>
  <circle cx="1135" cy="262" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="1165" cy="382" r="1" fill="white" opacity="0.4"/>
  <circle cx="90" cy="495" r="1.5" fill="white" opacity="0.45"/>
  <circle cx="235" cy="545" r="1" fill="white" opacity="0.5"/>
  <circle cx="375" cy="578" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="715" cy="570" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="875" cy="548" r="1" fill="white" opacity="0.45"/>
  <circle cx="1135" cy="530" r="1" fill="white" opacity="0.4"/>
  <circle cx="490" cy="572" r="1" fill="white" opacity="0.35"/>
  <circle cx="960" cy="565" r="1.5" fill="white" opacity="0.4"/>

  <!-- 4-pointed sparkles -->
  <!-- Gold large — top left -->
  <path d="M148,121 L150.1,132.9 L162,135 L150.1,137.1 L148,149 L145.9,137.1 L134,135 L145.9,132.9 Z" fill="#FFD700" opacity="0.9"/>
  <!-- Gold medium — top center-right -->
  <path d="M838,58 L839.5,66.5 L848,68 L839.5,69.5 L838,78 L836.5,69.5 L828,68 L836.5,66.5 Z" fill="#FFD700" opacity="0.75"/>
  <!-- Gold cluster above title -->
  <path d="M600,168 L601.2,174.8 L608,176 L601.2,177.2 L600,184 L598.8,177.2 L592,176 L598.8,174.8 Z" fill="#FFD700" opacity="0.9"/>
  <path d="M560,176 L560.75,180.25 L565,181 L560.75,181.75 L560,186 L559.25,181.75 L555,181 L559.25,180.25 Z" fill="#FFD700" opacity="0.6"/>
  <path d="M640,176 L640.75,180.25 L645,181 L640.75,181.75 L640,186 L639.25,181.75 L635,181 L639.25,180.25 Z" fill="#FFD700" opacity="0.6"/>
  <!-- Lavender — bottom corners -->
  <path d="M205,482 L206.2,488.8 L213,490 L206.2,491.2 L205,498 L203.8,491.2 L197,490 L203.8,488.8 Z" fill="#C4B5FD" opacity="0.8"/>
  <path d="M978,488 L979.2,494.8 L986,496 L979.2,497.2 L978,504 L976.8,497.2 L970,496 L976.8,494.8 Z" fill="#C4B5FD" opacity="0.75"/>
  <!-- White small — bottom -->
  <path d="M368,510 L368.9,515.1 L374,516 L368.9,516.9 L368,522 L367.1,516.9 L362,516 L367.1,515.1 Z" fill="white" opacity="0.5"/>
  <path d="M830,512 L830.9,517.1 L836,518 L830.9,518.9 L830,524 L829.1,518.9 L824,518 L829.1,517.1 Z" fill="white" opacity="0.45"/>

  <!-- Moon halo glow -->
  <circle cx="985" cy="130" r="120" fill="url(#moonHalo)"/>
  <!-- Crescent moon -->
  <circle cx="985" cy="130" r="72" fill="#FFD700" mask="url(#moonMask)"/>
  <circle cx="985" cy="130" r="73" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.2" mask="url(#moonMask)"/>

  <!-- Decorative border -->
  <rect x="46" y="46" width="1108" height="538" rx="22" fill="none" stroke="#534AB7" stroke-width="1.5" opacity="0.4"/>

  <!-- Brand name — glow layer -->
  <text x="600" y="310"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="112"
    font-weight="bold"
    fill="#7C6FD4"
    text-anchor="middle"
    filter="url(#titleGlow)"
    opacity="0.85">KazkaAI</text>
  <!-- Brand name — sharp layer -->
  <text x="600" y="310"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="112"
    font-weight="bold"
    fill="white"
    text-anchor="middle">KazkaAI</text>

  <!-- Dot divider -->
  <line x1="480" y1="340" x2="594" y2="340" stroke="#534AB7" stroke-width="1" opacity="0.5"/>
  <line x1="606" y1="340" x2="720" y2="340" stroke="#534AB7" stroke-width="1" opacity="0.5"/>
  <circle cx="600" cy="340" r="4" fill="#534AB7" opacity="0.7"/>

  <!-- Domain — neutral, language-agnostic -->
  <text x="600" y="395"
    font-family="'Courier New', monospace"
    font-size="26"
    fill="#8B7CF6"
    text-anchor="middle"
    letter-spacing="3"
    filter="url(#domainGlow)"
    opacity="0.9">kazka.ai</text>

  <!-- Decorative row of small dots at bottom -->
  <circle cx="540" cy="448" r="3" fill="#534AB7" opacity="0.4"/>
  <circle cx="560" cy="448" r="3" fill="#534AB7" opacity="0.5"/>
  <circle cx="580" cy="448" r="3" fill="#534AB7" opacity="0.6"/>
  <circle cx="600" cy="448" r="4" fill="#7C6FD4" opacity="0.7"/>
  <circle cx="620" cy="448" r="3" fill="#534AB7" opacity="0.6"/>
  <circle cx="640" cy="448" r="3" fill="#534AB7" opacity="0.5"/>
  <circle cx="660" cy="448" r="3" fill="#534AB7" opacity="0.4"/>
</svg>
