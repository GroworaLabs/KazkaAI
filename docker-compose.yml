services:
  postgres:
    image: postgres:16-alpine
    container_name: kazka_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kazka
      POSTGRES_PASSWORD: kazka_password
      POSTGRES_DB: kazka_ai
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kazka -d kazka_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: